<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc">
  <title id="title">Divine task queue</title>
  <desc id="desc">A celestial decision travels through an API and a task queue toward two cities, with a question mark over the outcome.</desc>
  <defs>
    <linearGradient id="sky" x2="1" y2="1">
      <stop stop-color="#13243d"/>
      <stop offset="1" stop-color="#344b65"/>
    </linearGradient>
    <linearGradient id="horizon" x2="0" y2="1">
      <stop stop-color="#edae70" stop-opacity=".3"/>
      <stop offset="1" stop-color="#edae70" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grain" width="38" height="38" patternUnits="userSpaceOnUse">
      <circle cx="4" cy="9" r="1" fill="#fff" opacity=".14"/>
      <circle cx="26" cy="31" r="1" fill="#fff" opacity=".12"/>
    </pattern>
  </defs>
  <rect width="1200" height="600" rx="24" fill="url(#sky)"/>
  <rect width="1200" height="600" rx="24" fill="url(#grain)"/>
  <circle cx="600" cy="304" r="243" fill="url(#horizon)"/>
  <path d="M0 466 Q210 398 398 463 T795 460 T1200 445 V600 H0Z" fill="#23364b"/>
  <path d="M0 512 Q282 444 526 513 T1200 495 V600 H0Z" fill="#182b3e"/>
  <g fill="none" stroke="#f3cc90" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="182" cy="205" r="68" opacity=".75"/>
    <path d="M134 207q48-50 96 0-48 50-96 0z"/>
    <circle cx="182" cy="207" r="15" fill="#f3cc90"/>
    <path d="M268 205h72m-13-10 13 10-13 10M524 205h93m-13-10 13 10-13 10M819 205h82m-13-10 13 10-13 10" stroke-dasharray="7 10"/>
  </g>
  <g fill="#f5e7d0" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" text-anchor="middle">
    <text x="182" y="317" font-size="18" letter-spacing="3">DECISION</text>
    <text x="989" y="206" font-size="66" fill="#f3cc90">?</text>
    <text x="989" y="317" font-size="18" letter-spacing="3">OUTCOME</text>
  </g>
  <rect x="351" y="151" width="158" height="108" rx="14" fill="#223b50" stroke="#87b5b3" stroke-width="2"/>
  <rect x="630" y="151" width="170" height="108" rx="14" fill="#223b50" stroke="#87b5b3" stroke-width="2"/>
  <g fill="#f5e7d0" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" text-anchor="middle">
    <text x="430" y="214" font-size="23">REST API</text>
    <text x="715" y="214" font-size="23">CELERY</text>
  </g>
  <g fill="#d5ad79" stroke="#f3cc90" stroke-width="2" stroke-linejoin="round">
    <path d="M865 478v-92h26v-28h23v120m6 0v-117h31v-29h24v146m11 0v-91h26v91m19 0v-129h26v-18h23v147"/>
    <path d="M896 358q44-52 96 0M1026 349q30-42 60 0" fill="none"/>
  </g>
  <g fill="#f3cc90" opacity=".8">
    <circle cx="77" cy="84" r="2"/><circle cx="315" cy="78" r="2"/><circle cx="538" cy="91" r="2"/>
    <circle cx="827" cy="71" r="2"/><circle cx="1102" cy="113" r="2"/>
  </g>
</svg>
